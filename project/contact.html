<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A helpful guide about Nigeria and its culture and lifestyles">
    <meta name="author" content="Afolabi Eniola | WDD131">
    <title>Newsletter | A Foreigner's Guide On Nigeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Roboto:ital,wght@0,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/project-small.css">
    <link rel="stylesheet" href="styles/project-large.css">
    <script src="scripts/contact.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">Nigeria</div>
        <button type="button" id="menu" aria-label="Open navigation menu"></button>
        <nav id="nav">
            <a href="index.html">Home</a>
            <a href="culture.html">Culture</a>
            <a href="tour.html">Site</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="newsletter-main">
        <section class="newsletter-hero">
            <img src="images/sites.webp" alt="a photo of lekki bridge">
            <div>
                <h1>Stay Connected to Nigeria</h1>
                <p>Get travel tips, cultural highlights, and updates delivered to your inbox.</p>
            </div>
        </section>

        <section class="form-section">
            <div class="form-card" id="formCard">
                <h2>Subscribe to our Newsletter</h2>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="firstName" required>
                    <span class="error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="lastName" required>
                    <span class="error" id="lastNameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. you@email.com" required>
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label>What interests you?</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" value="culture"> Culture & Traditions
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="travel"> Travel & Tourism
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="food"> Food & Cuisine
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="events"> Events & Festivals
                        </label>
                    </div>
                </div>

                <button type="button" id="submitBtn">Subscribe Now</button>
            </div>
        </section>
    </main>

    <footer>
        <p>©️copy💕Eniola Afolabi Nigeria💕</p>
    </footer>
</body>
</html>
